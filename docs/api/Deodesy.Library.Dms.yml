  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Parses a string representing degrees/minutes/seconds into numeric degrees.
  remarks: >-
    This method is very flexible on formats, allowing signed decimal degrees, or deg-min-sec optionally

    suffixed by compass direction (NSEW); a variety of separators are accepted.
  example:
  - >-
    <pre><code class="lang-csharp">var lat = Dms.Parse("51° 28′ 40.37″ N");

    var lon = Dms.Parse("000° 00′ 05.29″ W");

    var p1 = new Coordinate(lat, lon); // 51.4779°N, 0.0015°W</code></pre>
  syntax:
    content: public static double Parse(string dms)
    parameters:
    - id: dms
      type: System.String
      description: The DMS string to parse (e.g., "-3.62", "3 37 12W", "3°37′12″W").
    return:
      type: System.Double
      description: The parsed value in decimal degrees, or <xref href="System.Double.NaN" data-throw-if-not-resolved="false"></xref> if parsing fails.
    content.vb: Public Shared Function Parse(dms As String) As Double
  overload: Deodesy.Library.Dms.Parse*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown if the input string is null or empty.
  nameWithType.vb: Dms.Parse(String)
  fullName.vb: Deodesy.Library.Dms.Parse(String)
  name.vb: Parse(String)

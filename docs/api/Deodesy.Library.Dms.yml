  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Constrains degrees to the range -90..+90 (for latitude) using a general sawtooth wave function.
  example:
  - >-
    <pre><code class="lang-csharp">var d1 = Dms.Wrap90(91);  // 89

    var d2 = Dms.Wrap90(-91); // -89

    var d3 = Dms.Wrap90(180); // 0</code></pre>
  syntax:
    content: public static double Wrap90(double degrees)
    parameters:
    - id: degrees
      type: System.Double
      description: The degrees value to wrap.
    return:
      type: System.Double
      description: The wrapped degrees value within the range -90 to 90.
    content.vb: Public Shared Function Wrap90(degrees As Double) As Double

  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Converts numeric degrees to deg/min/sec latitude format (2-digit degrees, suffixed with N/S).
  example:
  - >-
    <pre><code class="lang-csharp">var lat1 = Dms.ToLat(53.145833, "dms", 0); // 053° 008′ 045″ N

    var lat2 = Dms.ToLat(-25.1234, "dm", 2);   // 025° 007.40′ S</code></pre>
  syntax:
    content: public static string ToLat(double deg, string format = "d", int dp = 2)
    parameters:
    - id: deg
      type: System.Double
      description: The decimal degrees latitude value.
    - id: format
      type: System.String
      description: 'The format to use: "d", "dm", or "dms".'
    - id: dp
      type: System.Int32
      description: The number of decimal places.
    return:
      type: System.String
      description: A string representation of the latitude in DMS format with N/S suffix.
    content.vb: Public Shared Function ToLat(deg As Double, format As String = "d", dp As Integer = 2) As String

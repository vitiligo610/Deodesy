  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Returns the compass point (to a given precision) for a supplied bearing.
  example:
  - >-
    <pre><code class="lang-csharp">var cp1 = Dms.CompassPoint(0);      // N

    var cp2 = Dms.CompassPoint(22.5);   // NNE

    var cp3 = Dms.CompassPoint(90);     // E

    var cp4 = Dms.CompassPoint(315, 1); // N</code></pre>
  syntax:
    content: public static string CompassPoint(double bearing, int precision = 3)
    parameters:
    - id: bearing
      type: System.Double
      description: The bearing in degrees (0-360).
    - id: precision
      type: System.Int32
      description: The precision of the compass point (1 for 8 points, 2 for 16 points, 3 for 32 points). Defaults to 3.
    return:
      type: System.String
      description: A string representing the compass point (e.g., "N", "NE", "NNE").
    content.vb: Public Shared Function CompassPoint(bearing As Double, precision As Integer = 3) As String
  overload: Deodesy.Library.Dms.CompassPoint*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Thrown if precision is not between 1 and 3.

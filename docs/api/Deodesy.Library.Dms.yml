  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Converts decimal degrees to deg/min/sec format.
  remarks: >-
    Degree, prime, double-prime symbols are added, but sign is discarded, though no compass

    direction is added. Degrees are zero-padded to 3 digits.
  example:
  - >-
    <pre><code class="lang-csharp">var s1 = Dms.ToDms(53.145833, "dms", 0); // 053° 008´ 045"

    var s2 = Dms.ToDms(53.145833, "dm", 2);  // 053° 008.75′

    var s3 = Dms.ToDms(53.145833, "d", 4);   // 053.1458°</code></pre>
  syntax:
    content: public static string ToDms(double deg, string format = "d", int dp = 2)
    parameters:
    - id: deg
      type: System.Double
      description: The decimal degrees value.
    - id: format
      type: System.String
      description: 'The format to use: "d" (degrees), "dm" (degrees and minutes), or "dms" (degrees, minutes, and seconds).'
    - id: dp
      type: System.Int32
      description: The number of decimal places for seconds (or minutes if format is "dm", or degrees if format is "d").
    return:
      type: System.String
      description: A string representation of the degrees in the specified DMS format.
    content.vb: Public Shared Function ToDms(deg As Double, format As String = "d", dp As Integer = 2) As String
  overload: Deodesy.Library.Dms.ToDms*
  nameWithType.vb: Dms.ToDms(Double, String, Integer)
  fullName.vb: Deodesy.Library.Dms.ToDms(Double, String, Integer)
  name.vb: ToDms(Double, String, Integer)

  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the distance (in meters) between two points on the Earth's surface

    using the Haversine formula.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(52.205, 0.119);

    var p2 = new Coordinate(48.857, 2.351);

    var geo = new LatLonSpherical();

    double distance = geo.Distance(p1, p2); // 404,279.16 m</code></pre>
  syntax:
    content: public double Distance(Coordinate startPoint, Coordinate endPoint)
    parameters:
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate.
    - id: endPoint
      type: Deodesy.Library.Coordinate
      description: The ending coordinate.
    return:
      type: System.Double
      description: The distance in meters.
    content.vb: Public Function Distance(startPoint As Coordinate, endPoint As Coordinate) As Double
  overload: Deodesy.Library.LatLonSpherical.Distance*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown if <code class="paramref">startPoint</code> or <code class="paramref">endPoint</code> is null.

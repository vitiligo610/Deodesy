  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the point of intersection of two great-circle paths.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(51.8853, 0.235); // Cambridge

    var brng1 = 108.549; // Bearing from Cambridge

    var p2 = new Coordinate(49.0034, 2.5735); // Paris

    var brng2 = 32.435; // Bearing from Paris

    var geo = new LatLonSpherical();

    var intersection = geo.Intersection(p1, brng1, p2, brng2);

    if (intersection != null)

    {
        Console.WriteLine($"Intersection: Lat {intersection.Latitude:F2}, Lon {intersection.Longitude:F2}");
        // Output: Intersection: Lat 50.99, Lon 4.50 (near Brussels)
    }

    else

    {
        Console.WriteLine("No intersection found.");
    }</code></pre>
  syntax:
    content: public Coordinate? Intersection(Coordinate firstPoint, double firstBearing, Coordinate secondPoint, double secondBearing)
    parameters:
    - id: firstPoint
      type: Deodesy.Library.Coordinate
      description: The starting point of the first path.
    - id: firstBearing
      type: System.Double
      description: The initial bearing of the first path in degrees.
    - id: secondPoint
      type: Deodesy.Library.Coordinate
      description: The starting point of the second path.
    - id: secondBearing

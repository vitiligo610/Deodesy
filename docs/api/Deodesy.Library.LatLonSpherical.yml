  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the destination point and final bearing when traveling along a great circle arc

    for a given start point, initial bearing, and distance.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(51.47788, -0.00147);

    var geo = new LatLonSpherical();

    var destPoint = geo.DestinationPoint(p1, 7794, 300.7); // 51.5136°N, 000.0983°W</code></pre>
  syntax:
    content: public Coordinate DestinationPoint(Coordinate startPoint, double distance, double bearing)
    parameters:
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate.
    - id: distance
      type: System.Double
      description: The distance to travel in same units as earth radius (meters).
    - id: bearing
      type: System.Double
      description: The initial bearing in degrees from north.
    return:
      type: Deodesy.Library.Coordinate
      description: A <xref href="Deodesy.Library.Coordinate" data-throw-if-not-resolved="false"></xref> object representing the destination point.

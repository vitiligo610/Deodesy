  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the along-track distance from a start point to the point on a great-circle path

    that is closest to a current point.
  remarks: >-
    This is the distance from the start point to where a perpendicular from the current point

    crosses the great-circle path.
  example:
  - >-
    <pre><code class="lang-csharp">var start = new Coordinate(53.3206, -1.7297);

    var end = new Coordinate(53.1887, 0.1334);

    var current = new Coordinate(53.2611, -0.7972);

    var geo = new LatLonSpherical();

    double alongTrackDist = geo.AlongTrackDistance(current, start, end); // 62,331.49 m</code></pre>
  syntax:
    content: public double AlongTrackDistance(Coordinate currentPoint, Coordinate startPoint, Coordinate endPoint)
    parameters:
    - id: currentPoint
      type: Deodesy.Library.Coordinate
      description: The current coordinate.
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate of the great-circle path.
    - id: endPoint
      type: Deodesy.Library.Coordinate
      description: The ending coordinate of the great-circle path.
    return:
      type: System.Double
      description: The distance along great circle to point nearest to current point in meters.
    content.vb: Public Function AlongTrackDistance(currentPoint As Coordinate, startPoint As Coordinate, endPoint As Coordinate) As Double

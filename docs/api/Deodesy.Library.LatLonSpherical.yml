  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the along-track distance from a start point to the point on a great-circle path

    that is closest to a current point.
  remarks: >-
    This is the distance from the start point to where a perpendicular from the current point

    crosses the great-circle path.
  example:
  - >-
    <pre><code class="lang-csharp">var start = new Coordinate(53.2611, -0.7972); // N of Lincoln

    var end = new Coordinate(48.5734, 7.7161); // Strasbourg

    var current = new Coordinate(53.1887, 0.1334); // E of Lincoln

    var geo = new LatLonSpherical();

    double alongTrackDist = geo.AlongTrackDistanceTo(current, start, end);

    Console.WriteLine($"Along-track distance: {alongTrackDist:F2} km"); // Output: Along-track distance: 53.7 km</code></pre>
  syntax:

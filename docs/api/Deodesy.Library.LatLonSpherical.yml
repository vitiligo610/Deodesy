  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the cross-track distance from a current point to a great-circle path defined by two other points.
  remarks: The cross-track distance is the shortest distance from the current point to the great-circle path.
  example:
  - >-
    <pre><code class="lang-csharp">var start = new Coordinate(53.3206, -1.7297);

    var end = new Coordinate(53.1887, 0.1334);

    var current = new Coordinate(53.2611, -0.7972);

    var geo = new LatLonSpherical();

    double crossTrackDist = geo.CrossTrackDistance(current, start, end); // -307.5 m</code></pre>
  syntax:
    content: public double CrossTrackDistance(Coordinate currentPoint, Coordinate startPoint, Coordinate endPoint)
    parameters:
    - id: currentPoint
      type: Deodesy.Library.Coordinate
      description: The current coordinate.
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate of the great-circle path.
    - id: endPoint
      type: Deodesy.Library.Coordinate
      description: The ending coordinate of the great-circle path.
    return:
      type: System.Double
      description: The cross-track distance in meters (-ve if to left, +ve if to right of path).
    content.vb: Public Function CrossTrackDistance(currentPoint As Coordinate, startPoint As Coordinate, endPoint As Coordinate) As Double
  overload: Deodesy.Library.LatLonSpherical.CrossTrackDistance*
  exceptions:

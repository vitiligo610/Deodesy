  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the area of a spherical polygon where the sides of the polygon are great circle

    arcs joining the vertices.
  remarks: >-
    Uses method due to Karney: https://geographiclib.sourceforge.io/html/js/geographiclib-geodesic_src_PolygonArea.js.html

    (Karney's method is probably more efficient than the more widely known L’Huilier’s Theorem)
  example:
  - >-
    <pre><code class="lang-csharp">double area = LatLonSpherical.Area(
        new Coordinate[] { new Coordinate(  0, 0), new Coordinate(1, 0), new Coordinate(0, 1) }
    ); // 6.18e9 m²</code></pre>
  syntax:
    content: public static double Area(Coordinate[] polygon)
    parameters:
    - id: polygon
      type: Deodesy.Library.Coordinate[]
      description: Array of coordinates defining vertices of the polygon.
    return:
      type: System.Double
      description: The area of the polygon in the same units as radius (meters).
    content.vb: Public Shared Function Area(polygon As Coordinate()) As Double

  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the maximum latitude reached when traveling on a great circle from a start point

    with a given initial bearing (using Clairaut’s formula).
  remarks: >-
    The maximum latitude is independent of longitude; it will be the same for all points on a given latitude.

    Negate the result for the minimum latitude (in the Southern Hemisphere).
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(51.51, 0.0);

    double maxLat = LatLonSpherical.MaxLatitude(p1, 90.0); // 51.51°</code></pre>
  syntax:
    content: public static double MaxLatitude(Coordinate startPoint, double bearing)
    parameters:
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate.
    - id: bearing
      type: System.Double
      description: The initial bearing in degrees.
    return:
      type: System.Double
      description: The maximum latitude in degrees.
    content.vb: Public Shared Function MaxLatitude(startPoint As Coordinate, bearing As Double) As Double
  overload: Deodesy.Library.LatLonSpherical.MaxLatitude*

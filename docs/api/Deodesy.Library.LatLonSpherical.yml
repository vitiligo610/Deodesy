  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the pair of meridians at which a great circle defined by two points crosses a given latitude.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(53.3206, -1.7297);

    var p2 = new Coordinate(53.1887, 0.1334);

    var geo = new LatLonSpherical();

    double[]? crossingLons = geo.CrossingParallels(p1, p2, 45.5); // 50.4775°S, 32.0812°N</code></pre>
  syntax:
    content: public double[]? CrossingParallels(Coordinate startPoint, Coordinate endPoint, double latitude)
    parameters:
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate of the great circle.
    - id: endPoint
      type: Deodesy.Library.Coordinate
      description: The ending coordinate of the great circle.
    - id: latitude
      type: System.Double
      description: The latitude (in degrees) for which to find the crossing meridians.
    return:
      type: System.Double[]
      description: >-
        An array of two doubles representing the longitudes (in degrees, wrapped to -180 to 180)

        of the crossing points, or null if the great circle does not reach the given latitude.
    content.vb: Public Function CrossingParallels(startPoint As Coordinate, endPoint As Coordinate, latitude As Double) As Double()
  overload: Deodesy.Library.LatLonSpherical.CrossingParallels*

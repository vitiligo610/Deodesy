  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the final bearing (direction) when arriving at an end point from a start point.
  remarks: The final bearing will differ from the initial bearing by varying degrees according to distance and latitude.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(52.205, 0.119);

    var p2 = new Coordinate(48.857, 2.351);

    var geo = new LatLonSpherical();

    double finalBearing = geo.FinalBearing(p1, p2); // 157.9°</code></pre>
  syntax:
    content: public double FinalBearing(Coordinate startPoint, Coordinate endPoint)
    parameters:
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate.
    - id: endPoint
      type: Deodesy.Library.Coordinate
      description: The ending coordinate.
    return:
      type: System.Double
      description: The final bearing in degrees, in the range 0 to 360.

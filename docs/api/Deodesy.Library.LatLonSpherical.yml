  namespace: Deodesy.Library
  summary: Calculates the point of intersection of two great-circle paths defined by points and bearings.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(51.8853, 0.2545), brng1 = 108.547;

    var p2 = new Coordinate(49.0034, 2.5735), brng2 =  32.435;

    var geo = new LatLonSpherical();

    var intersection = geo.IntersectionPoint(p1, brng1, p2, brng2); // 50.9078°N, 4.5084°E</code></pre>
  syntax:
    content: public Coordinate? IntersectionPoint(Coordinate firstPoint, double firstBearing, Coordinate secondPoint, double secondBearing)

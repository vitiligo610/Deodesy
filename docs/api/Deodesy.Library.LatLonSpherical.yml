  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the cross-track distance from a current point to a great-circle path defined by two other points.
  remarks: The cross-track distance is the shortest distance from the current point to the great-circle path.
  example:
  - >-
    <pre><code class="lang-csharp">var start = new Coordinate(53.3206, -1.7297);

    var end = new Coordinate(53.1887, 0.1334);

    var current = new Coordinate(53.2611, -0.7972);

    double crossTrackDist = LatLonSpherical.CrossTrackDistance(current, start, end); // -307.5 m</code></pre>
  syntax:
    content: public static double CrossTrackDistance(Coordinate currentPoint, Coordinate startPoint, Coordinate endPoint)
    parameters:
    - id: currentPoint
      type: Deodesy.Library.Coordinate
      description: The current coordinate.
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate of the great-circle path.

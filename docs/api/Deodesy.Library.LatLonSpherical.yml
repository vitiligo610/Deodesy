  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: >-
    Calculates the distance (in kilometers) between two points on the Earth's surface

    using the Haversine formula.
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(51.51, 0.0); // London

    var p2 = new Coordinate(38.89, -77.03); // Washington D.C.

    var geo = new LatLonSpherical();

    double distance = geo.Distance(p1, p2);

    Console.WriteLine($"Distance: {distance:F2} km"); // Output: Distance: 5908.38 km (approx)</code></pre>
  syntax:
    content: public double Distance(Coordinate startPoint, Coordinate endPoint)
    parameters:
    - id: startPoint
      type: Deodesy.Library.Coordinate
      description: The starting coordinate.
    - id: endPoint
      type: Deodesy.Library.Coordinate
      description: The ending coordinate.
    return:
      type: System.Double
      description: The distance in kilometers.

  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the cross-track distance from a current point to a great-circle path defined by two other points.
  remarks: The cross-track distance is the shortest distance from the current point to the great-circle path.
  example:
  - >-
    <pre><code class="lang-csharp">var start = new Coordinate(53.2611, -0.7972); // N of Lincoln

    var end = new Coordinate(48.5734, 7.7161); // Strasbourg

    var current = new Coordinate(53.1887, 0.1334); // E of Lincoln

    var geo = new LatLonSpherical();


  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library
  summary: Calculates the point of intersection of two great-circle paths defined by points and bearings.
  remarks: See https://www.edwilliams.org/avform.htm#Intersection
  example:
  - >-
    <pre><code class="lang-csharp">var p1 = new Coordinate(51.8853, 0.2545), brng1 = 108.547;

    var p2 = new Coordinate(49.0034, 2.5735), brng2 =  32.435;

    var intersection = LatLonSpherical.IntersectionPoint(p1, brng1, p2, brng2); // 50.9078°N, 4.5084°E</code></pre>
  syntax:
    content: public static Coordinate? IntersectionPoint(Coordinate firstPoint, double firstBearing, Coordinate secondPoint, double secondBearing)
    parameters:
    - id: firstPoint
      type: Deodesy.Library.Coordinate
      description: The starting point of the first path.
    - id: firstBearing
      type: System.Double
      description: The initial bearing of the first path in degrees.
    - id: secondPoint
      type: Deodesy.Library.Coordinate
      description: The starting point of the second path.
    - id: secondBearing
      type: System.Double
      description: The initial bearing of the second path in degrees.
    return:
      type: Deodesy.Library.Coordinate
      description: A <xref href="Deodesy.Library.Coordinate" data-throw-if-not-resolved="false"></xref> object representing the intersection point, or null if no intersection or paths are coincident.
    content.vb: Public Shared Function IntersectionPoint(firstPoint As Coordinate, firstBearing As Double, secondPoint As Coordinate, secondBearing As Double) As Coordinate

  assemblies:
  - Deodesy.Library
  namespace: Deodesy.Library.Helpers
  summary: Rounds a double value to a specified number of decimal places.
  example:
  - >-
    <pre><code class="lang-csharp">double num = 123.45678;

    Console.WriteLine(num.ToFixed(2)); // Output: 123.46</code></pre>
  syntax:

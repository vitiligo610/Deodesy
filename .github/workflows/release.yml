name: Create library release

on:
  pull_request:
    types:
      - closed
    branches:
      main

jobs:
  generate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2

      - name: Github Tag Bump
        id: tag_bump
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_VERSION: ${{ github.ref_name }}
          DEFAULT_BUMP: patch

    outputs:
      new_version: ${{ steps.tag_bump.outputs.new_tag }}

  package-and-publish-lib:
    runs-on: ubuntu-latest
    needs: generate-version

    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 8.x

      - name: Generate NuGet Package
        run: |
          dotnet pack ${{ github.workspace }}/src/Deodesy.Library/Deodesy.Library.csproj \
          -c Release \
          -p:PackageVersion=${{ needs.generate-version.outputs.new_version }} \
          -p:RepositoryUrl=https://github.com/vitiligo610/Deodesy \
          -o packages
          
      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-version.outputs.new_version }}
          files: packages/*.nupkg
          body: |
            ## Deodesy Release ${{ needs.generate-version.outputs.new_version }}
            
            This release includes the compiled NuGet package for .NET Standard 2.0.
            
            ### Installation
            - Download the `.nupkg` from the assets below.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}